name: Unit Tests

on:
  - workflow_dispatch
  - push
  - pull_request

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PDM
        uses: pdm-project/setup-pdm@v4
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pdm install --dev
      - name: Run pytest
        id: pytest
        run: pdm run pytest --cov src --cov-report xml --cov-report term
      - name: Code Coverage Summary Report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
